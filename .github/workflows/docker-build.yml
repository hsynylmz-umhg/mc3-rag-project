name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. ADIM: Kök diskteki (Root) tüm gereksiz Android/.NET paketlerini silerek ekstra 40GB aç
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 2. HAYAT KURTARICI ADIM: Docker'ın merkezini 80GB'lık devasa yüksek hızlı gizli diske taşı!
      - name: Move Docker to HUGE /mnt disk
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      # 3. Kodlarımızı sunucuya indir
      - name: Checkout repository
        uses: actions/checkout@v3

      # 4. Gelişmiş derleyici motorunu kur (Devasa imajları diski boğmadan doğrudan ağa iter)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Docker Hub girişi
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Derle ve fırlat! (buildx sayesinde imaj diski doldurmaz, parça parça Hub'a uçar)
      - name: Build and Push to Docker Hub
        run: |
          docker buildx build --push -t hsynylmz/mc3-rag:latest starter
