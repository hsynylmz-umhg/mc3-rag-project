name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. ADIM: GitHub sunucusundaki tüm gereksiz devasa araçları silip ~45GB ekstra yer açıyoruz
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. ADIM: İşi şansa bırakmayıp kalan inatçı Android ve .NET klasörlerini kökten uçuruyoruz
      - name: Extra Cleanup
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      # 3. ADIM: Kodlarımızı indiriyoruz
      - name: Checkout repository
        uses: actions/checkout@v3

      # 4. ADIM: Docker Hub girişi
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. ADIM: BUILDKIT İPTAL! Eski nesil motorla o 20GB'lık fazlalığı atlatıp doğrudan fırlatıyoruz!
      - name: Build and Push
        env:
          DOCKER_BUILDKIT: 0
        run: |
          docker build --no-cache -t hsynylmz/mc3-rag:latest starter
          docker push hsynylmz/mc3-rag:latest
