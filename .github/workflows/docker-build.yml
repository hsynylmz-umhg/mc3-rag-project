name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. ADIM: Önce diskte devasa bir yer açıyoruz (Kodlarımız silinmesin diye bunu öne aldık)
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. ADIM: Yer açıldıktan sonra kodlarımızı güvenle sunucuya indiriyoruz
      - name: Checkout repository
        uses: actions/checkout@v3
        
      # (Kontrol amaçlı) İndirilen dosyaları listele
      - name: Check files
        run: ls -la

      # 3. ADIM: Docker Hub'a giriş yap
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. ADIM: 40GB'lık imajı derle ve fırlat!
      - name: Build and Push to Docker Hub
        run: |
          docker build -t hsynylmz/mc3-rag:latest starter
          docker push hsynylmz/mc3-rag:latest
